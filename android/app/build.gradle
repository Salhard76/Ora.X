// Ora X 11.0 · 𝑺𝒂𝒍𝑯𝒂𝒓𝒅
plugins { id 'com.android.application' }

android {
    namespace 'com.orax.app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.orax.app'
        minSdk 26
        targetSdk 35
        def versionFile = rootProject.file('../version.txt')
        // Difensivo: toglie BOM/spazi e qualsiasi suffisso non numerico; se resta vuoto/malformato usa il fallback.
        def appVersion = (versionFile.exists() ? versionFile.text.replace('\uFEFF', '').trim() : '11.0').replaceAll(/[^0-9.].*$/, '')
        if (!(appVersion ==~ /^\d+(\.\d+){0,2}$/)) appVersion = '11.0'
        def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
        def versionCodeValue = versionParts[0] * 10000 + (versionParts.size() > 1 ? versionParts[1] * 100 : 0) + (versionParts.size() > 2 ? versionParts[2] : 0)

        versionCode versionCodeValue
        versionName appVersion
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
